[project]
name = "erp-petshop"
version = "0.1.0"
description = "ERP Pet Shop — banho e tosa MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
